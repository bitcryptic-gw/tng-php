; TNG PHP settings — carries over the effective values from the tangramor/nginx-php8-fpm
; container as inventoried 2026-11-07 (see repo README).
[PHP]

; --- resource limits (parity with the old image) ---
memory_limit = 128M
upload_max_filesize = 100M
post_max_size = 100M
max_execution_time = 30
max_input_vars = 1000
max_file_uploads = 20
file_uploads = On

; --- environment / time ---
date.timezone = UTC
variables_order = EGPCS

; --- error handling (parity: errors logged, not displayed) ---
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED
log_errors = On
expose_php = Off

; --- opcache (parity) ---
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; --- hardening ---
; No MTA exists in this image and TNG's usesmtp is "0". Drain the message and fail,
; so mail() returns false exactly as before without a "cannot execute" warning.
sendmail_path = /usr/local/bin/tng-sendmail-disabled
; Not used by TNG; the upload-progress handler is a classic pre-auth attack surface.
session.upload_progress.enabled = 0
session.use_strict_mode = 1

allow_url_fopen = On

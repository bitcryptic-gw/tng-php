# Apache hardening for TNG (Apache + mod_php)
# Loaded via `a2enconf zz-tng` in the Dockerfile.

# Do not advertise the Apache version in headers or error pages.
ServerTokens Prod
ServerSignature Off
ServerName localhost
TraceEnable Off

# Directory listing is never appropriate here.
<Directory /var/www/html>
    Options -Indexes -Includes -ExecCGI
    AllowOverride None
    Require all granted
    DirectoryIndex index.php index.html
</Directory>

# Defence in depth: deny every dot-path, at any depth.
# This is the gap found on 2026-11-06 where a Tailscale state directory inside the
# docroot was only protected by Unix file modes and by nginx not running as root.
<DirectoryMatch "/\.[^/]+(/|$)">
    Require all denied
</DirectoryMatch>

<FilesMatch "^\.">
    Require all denied
</FilesMatch>

# .htaccess/.htpasswd and friends can never be served, even if AllowOverride is ever changed.
<FilesMatch "^(\.htaccess|\.htpasswd|\.htgroup|\.user\.ini)$">
    Require all denied
</FilesMatch>
